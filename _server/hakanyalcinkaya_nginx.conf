# Redirect all HTTP requests to the canonical HTTPS domain (config/settings/settings_prod.py CANONICAL_HOST).
server {
    listen 80;
    listen [::]:80;
    server_name hakanyalcinkaya.com www.hakanyalcinkaya.com;

    return 301 https://hakanyalcinkaya.com$request_uri;
}

# www -> canonical. Certificate must cover both names.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hakanyalcinkaya.com;

    ssl_certificate     /var/www/hakanyalcinkaya/hakanyalcinkaya_dj/_server/ssl/hakanyalcinkaya_2026.crt;
    ssl_certificate_key /var/www/hakanyalcinkaya/hakanyalcinkaya_dj/_server/ssl/hakanyalcinkaya_2026.key;

    return 301 https://hakanyalcinkaya.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hakanyalcinkaya.com;

    charset utf-8;

    # SSL certificate files (hakanyalcinkaya.com ve www.hakanyalcinkaya.com'u kapsamalı). _server/ssl/ git'te takip edilmez (.gitignore).
    # IMPORTANT:
    # ssl_certificate should be a full-chain file in this order:
    # 1) domain/server certificate
    # 2) intermediate certificate(s)
    # Do NOT include the root/anchor certificate in this file.
    ssl_certificate     /var/www/hakanyalcinkaya/hakanyalcinkaya_dj/_server/ssl/hakanyalcinkaya_2026.crt;
    ssl_certificate_key /var/www/hakanyalcinkaya/hakanyalcinkaya_dj/_server/ssl/hakanyalcinkaya_2026.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Strong TLS 1.2 cipher suites. TLS 1.3 cipher suites are managed by OpenSSL/Nginx automatically.
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS, X-Frame-Options, X-Content-Type-Options ve Referrer-Policy Django'dan gelir (settings_prod.py; HSTS süresi
    # .env SECURE_HSTS_SECONDS). Burada tekrar eklenirse başlıklar iki kez ve farklı değerle gider.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    access_log /var/log/nginx/hakanyalcinkaya_access.log;
    error_log  /var/log/nginx/hakanyalcinkaya_error.log;

    # Genel sınır; büyük dosyalar yalnız stüdyoda yüklenir (aşağıda).
    client_max_body_size 20M;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Stüdyoya yüklenen ham videolar Bunny/Vimeo'ya gönderilene kadar burada durur; dışarıya açılmaz.
    location ^~ /media/video_uploads/ {
        return 404;
    }

    location /media/ {
        alias /var/www/hakanyalcinkaya/static_cdn/media_files/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Statik dosya adları henüz özetsiz (prod'da ManifestStaticFilesStorage yok, TODO.md). Uzun önbellek deploy sonrası
    # eski CSS/JS gösterir; Manifest açılınca 365d yapılır.
    location /static/ {
        alias /var/www/hakanyalcinkaya/static_cdn/static_files/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Video ve altyazı yükleme: büyük gövde, uzun işlem. uWSGI'de aynı adres için harakiri 900 sn
    # (_server/hakanyalcinkaya_uwsgi.ini).
    location /studio/ {
        client_max_body_size 8G;
        client_body_timeout 300s;
        uwsgi_read_timeout 900s;
        uwsgi_send_timeout 900s;

        include uwsgi_params;
        uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
        uwsgi_pass unix:/run/uwsgi/hakanyalcinkaya.sock;
    }

    location / {
        include uwsgi_params;
        # Django HTTPS'i bu başlıktan anlar (SECURE_PROXY_SSL_HEADER); yoksa SECURE_SSL_REDIRECT sonsuz döngüye girer.
        uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
        uwsgi_pass unix:/run/uwsgi/hakanyalcinkaya.sock;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;
}
