[uwsgi]
project = config
uid = www-data
gid = www-data
base = /%(uid)

chdir = /var/www/hakanyalcinkaya/hakanyalcinkaya_dj
home = /var/Env/hakanyalcinkaya_312
module = %(project).wsgi:application

master = true
processes = 2


threads = 1


harakiri = 30
harakiri-verbose = true

# Stüdyoda video ve altyazı tek istekle yüklenir (studio/forms.py NewVideoLessonForm): büyük dosyanın Django'ya okunup
# media'ya yazılması 30 sn'yi geçer. Stüdyo yalnız yönetici içindir; süre yalnız bu adreslerde uzatılır.
# Nginx'te /studio/ için uwsgi_read_timeout bu süreyle uyumlu olmalı (_server/hakanyalcinkaya_nginx.conf).
route = ^/studio/ harakiri:900


max-requests = 5000
max-requests-delta = 200
reload-on-rss = 512
die-on-term = true



socket = /run/uwsgi/hakanyalcinkaya.sock
chown-socket = www-data:www-data
chmod-socket = 666
vacuum = true

# Emperor altında çalışır (/etc/uwsgi/sites/hakanyalcinkaya.ini bu dosyaya link): daemonize kullanılmaz,
# süreç ayrılmadan aynı dosyaya log yazılır.
logto = /var/www/hakanyalcinkaya/log/uwsgi.log

# Kod güncellemesinde kesintisiz yeniden yükleme. Emperor'un .ini değişikliğini algılamasına
# bağlı kalmamak için uygulamanın kendi izlediği dosya kullanılır (git'te takip edilmez):
#     touch /var/www/hakanyalcinkaya/hakanyalcinkaya_dj/reload.txt
touch-reload = /var/www/hakanyalcinkaya/hakanyalcinkaya_dj/reload.txt
