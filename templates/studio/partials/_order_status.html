{% if order.status == "paid" %}<span class="badge rounded-1 bg-success-subtle text-success-emphasis border border-success-subtle fw-medium">{{ order.get_status_display }}</span>{% elif order.status == "pending" %}<span class="badge rounded-1 bg-warning-subtle text-warning-emphasis border border-warning-subtle fw-medium">{{ order.get_status_display }}</span>{% elif order.status == "failed" %}<span class="badge rounded-1 bg-danger-subtle text-danger-emphasis border border-danger-subtle fw-medium">{{ order.get_status_display }}</span>{% else %}<span class="badge rounded-1 border text-body-secondary fw-medium">{{ order.get_status_display }}</span>{% endif %}
