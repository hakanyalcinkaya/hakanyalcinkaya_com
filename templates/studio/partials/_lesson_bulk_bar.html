{# Seçili videolara toplu işlem çubuğu; seçim olunca görünür (studio.js). Seçili kutular isteğe eklenir. #}
{% url 'studio:lesson_bulk' course.id as bulk_url %}
<div class="studio-bulk-bar card shadow-sm border-primary-subtle mt-3 d-none" data-bulk-bar role="region" aria-label="Seçili videolar için işlemler">
  <div class="card-body d-flex flex-wrap align-items-center gap-2 py-2">
    <span class="small fw-medium me-1"><span data-bulk-count>0</span> video seçili</span>
    <div class="btn-group btn-group-sm" role="group" aria-label="Yayın durumu">
      <button type="button" class="btn btn-outline-success" hx-post="{{ bulk_url }}" hx-vals='{"action": "publish"}' hx-include="[data-lesson-check]:checked" hx-target="#course-sections" hx-swap="outerHTML"><i class="bi bi-check2-circle me-1" aria-hidden="true"></i>Yayınla</button>
      <button type="button" class="btn btn-outline-secondary" hx-post="{{ bulk_url }}" hx-vals='{"action": "draft"}' hx-include="[data-lesson-check]:checked" hx-target="#course-sections" hx-swap="outerHTML">Taslağa al</button>
    </div>
    <div class="btn-group btn-group-sm" role="group" aria-label="Önizleme">
      <button type="button" class="btn btn-outline-primary" hx-post="{{ bulk_url }}" hx-vals='{"action": "preview_on"}' hx-include="[data-lesson-check]:checked" hx-target="#course-sections" hx-swap="outerHTML"><i class="bi bi-eye me-1" aria-hidden="true"></i>Önizlemeyi aç</button>
      <button type="button" class="btn btn-outline-secondary" hx-post="{{ bulk_url }}" hx-vals='{"action": "preview_off"}' hx-include="[data-lesson-check]:checked" hx-target="#course-sections" hx-swap="outerHTML"><i class="bi bi-eye-slash me-1" aria-hidden="true"></i>Önizlemeyi kapat</button>
    </div>
    <div class="btn-group btn-group-sm" role="group" aria-label="Ders türü">
      <button type="button" class="btn btn-outline-secondary" hx-post="{{ bulk_url }}" hx-vals='{"action": "to_text"}' hx-include="[data-lesson-check]:checked" hx-target="#course-sections" hx-swap="outerHTML"><i class="bi bi-file-text me-1" aria-hidden="true"></i>İçerik dersi yap</button>
      <button type="button" class="btn btn-outline-secondary" hx-post="{{ bulk_url }}" hx-vals='{"action": "to_video"}' hx-include="[data-lesson-check]:checked" hx-target="#course-sections" hx-swap="outerHTML"><i class="bi bi-play-circle me-1" aria-hidden="true"></i>Video dersi yap</button>
    </div>
    <div class="btn-group btn-group-sm" role="group" aria-label="Silme">
      <button type="button" class="btn btn-outline-danger" hx-post="{{ bulk_url }}" hx-vals='{"action": "delete"}' hx-include="[data-lesson-check]:checked" hx-target="#course-sections" hx-swap="outerHTML" hx-confirm="Seçili videolar (dersler) silinsin mi? Platformdaki video dosyaları durur."><i class="bi bi-trash3 me-1" aria-hidden="true"></i>Sil</button>
      <button type="button" class="btn btn-danger" hx-post="{{ bulk_url }}" hx-vals='{"action": "delete_remote"}' hx-include="[data-lesson-check]:checked" hx-target="#course-sections" hx-swap="outerHTML" hx-confirm="Seçili videolar ve platformdaki (Bunny/Vimeo) video dosyaları silinsin mi? Bu geri alınamaz.">Sil + video dosyalarını sil</button>
    </div>
    <button type="button" class="btn btn-link btn-sm link-secondary ms-auto" data-bulk-clear>Seçimi temizle</button>
  </div>
</div>
