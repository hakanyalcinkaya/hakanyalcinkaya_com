{# Gönderim listesi (tekil e-postalar ya da toplu gönderimin alıcıları); filtreler GET'te, HTMX ile yalnız bu blok yenilenir. #}
<div id="email-log-list">
  <form class="d-flex flex-wrap align-items-center gap-2 mb-3" action="{{ list_url }}" hx-get="{{ list_url }}" hx-target="#email-log-list" hx-swap="outerHTML" hx-push-url="true" hx-trigger="change, input changed delay:400ms from:input[name=q]" hx-sync="this:replace">
    {% if not in_batch %}
    <select name="template" class="form-select form-select-sm w-auto" aria-label="Şablon">
      <option value="">Tüm şablonlar</option>
      {% for key, label in templates %}<option value="{{ key }}"{% if key == template %} selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
    {% endif %}
    <select name="status" class="form-select form-select-sm w-auto" aria-label="Durum">
      <option value="">Tüm durumlar</option>
      {% for value, label in statuses %}<option value="{{ value }}"{% if value == status %} selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
    <input type="search" name="q" value="{{ query }}" class="form-control form-control-sm w-auto" placeholder="Alıcı ya da konu" aria-label="Alıcı ya da konu ara">
  </form>
  <div class="table-responsive">
    <table class="table table-sm table-hover align-middle small mb-0">
      <thead><tr><th scope="col">Gönderim</th><th scope="col">Alıcı</th>{% if not in_batch %}<th scope="col">Konu</th>{% endif %}<th scope="col">Durum</th><th scope="col" class="text-end">Açılma</th><th scope="col" class="text-end">Tıklama</th></tr></thead>
      <tbody>
        {% include "studio/partials/_email_log_rows.html" %}
      </tbody>
    </table>
  </div>
</div>
