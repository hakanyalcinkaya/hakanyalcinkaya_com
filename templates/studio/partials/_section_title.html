<div id="section-{{ section.id }}-title" class="d-flex align-items-start gap-2">
  <button type="button" class="btn btn-link btn-sm p-0 link-secondary flex-shrink-0" hx-get="{% url 'studio:section_title' section.id %}?edit=1" hx-target="#section-{{ section.id }}-title" hx-swap="outerHTML" aria-label="Kategori adını düzenle"><i class="bi bi-pencil" aria-hidden="true"></i></button>
  <a href="{% url 'studio:section_detail' section.id %}" class="fw-semibold link-body-emphasis text-decoration-none min-w-0">{{ section.title }}</a>
</div>
