{# Gönderim sayıları kartları: s = EmailLogQuerySet.stats() sonucu. #}
<div class="row row-cols-2 row-cols-md-5 g-3 mb-4">
  <div class="col"><div class="border rounded p-3 h-100"><div class="small text-body-secondary">Toplam</div><div class="fs-4 fw-semibold">{{ s.total }}</div></div></div>
  <div class="col"><div class="border rounded p-3 h-100"><div class="small text-body-secondary">Gönderildi</div><div class="fs-4 fw-semibold">{{ s.sent }}</div></div></div>
  <div class="col"><div class="border rounded p-3 h-100"><div class="small text-body-secondary">Hata</div><div class="fs-4 fw-semibold{% if s.failed %} text-danger{% endif %}">{{ s.failed }}</div></div></div>
  <div class="col"><div class="border rounded p-3 h-100"><div class="small text-body-secondary">Açılma</div><div class="fs-4 fw-semibold">%{{ s.open_rate }}</div><div class="small text-body-tertiary">{{ s.opened }} e-posta</div></div></div>
  <div class="col"><div class="border rounded p-3 h-100"><div class="small text-body-secondary">Tıklama</div><div class="fs-4 fw-semibold">%{{ s.click_rate }}</div><div class="small text-body-tertiary">{{ s.clicked }} e-posta</div></div></div>
</div>
