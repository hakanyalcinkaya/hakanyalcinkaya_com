{# Markdown araç çubuğu: [data-md-editor] içindeki [data-md-input] alanına uygular (studio.js). #}
<div class="btn-toolbar gap-1 {{ toolbar_class|default:'ms-auto' }}" role="toolbar" aria-label="Biçimlendirme" data-md-toolbar>
  <div class="btn-group btn-group-sm">
    <button type="button" class="btn btn-outline-secondary" data-md="h2" title="Başlık"><i class="bi bi-type-h2" aria-hidden="true"></i><span class="visually-hidden">Başlık</span></button>
    <button type="button" class="btn btn-outline-secondary" data-md="bold" title="Kalın (Ctrl+B)"><i class="bi bi-type-bold" aria-hidden="true"></i><span class="visually-hidden">Kalın</span></button>
    <button type="button" class="btn btn-outline-secondary" data-md="italic" title="İtalik (Ctrl+I)"><i class="bi bi-type-italic" aria-hidden="true"></i><span class="visually-hidden">İtalik</span></button>
  </div>
  <div class="btn-group btn-group-sm">
    <button type="button" class="btn btn-outline-secondary" data-md="ul" title="Madde listesi"><i class="bi bi-list-ul" aria-hidden="true"></i><span class="visually-hidden">Madde listesi</span></button>
    <button type="button" class="btn btn-outline-secondary" data-md="ol" title="Numaralı liste"><i class="bi bi-list-ol" aria-hidden="true"></i><span class="visually-hidden">Numaralı liste</span></button>
    <button type="button" class="btn btn-outline-secondary" data-md="quote" title="Alıntı"><i class="bi bi-quote" aria-hidden="true"></i><span class="visually-hidden">Alıntı</span></button>
  </div>
  <div class="btn-group btn-group-sm">
    <button type="button" class="btn btn-outline-secondary" data-md="link" title="Bağlantı (Ctrl+K)"><i class="bi bi-link-45deg" aria-hidden="true"></i><span class="visually-hidden">Bağlantı</span></button>
    <button type="button" class="btn btn-outline-secondary" data-md="code" title="Kod"><i class="bi bi-code" aria-hidden="true"></i><span class="visually-hidden">Satır içi kod</span></button>
    <button type="button" class="btn btn-outline-secondary" data-md="codeblock" title="Kod bloğu"><i class="bi bi-code-square" aria-hidden="true"></i><span class="visually-hidden">Kod bloğu</span></button>
    <button type="button" class="btn btn-outline-secondary" data-md="hr" title="Ayraç"><i class="bi bi-hr" aria-hidden="true"></i><span class="visually-hidden">Ayraç</span></button>
  </div>
</div>
