<button type="button" id="section-{{ section.id }}-status" class="btn btn-sm py-0 px-2 {% if section.is_published %}btn-success{% else %}btn-outline-secondary{% endif %}" hx-post="{% url 'studio:section_status' section.id %}" hx-target="this" hx-swap="outerHTML" aria-pressed="{{ section.is_published|yesno:'true,false' }}" title="Yayına al / taslağa çevir">{{ section.get_status_display }}</button>
