<form class="border rounded bg-body-tertiary p-3 mt-3" hx-post="{% url 'studio:lesson_subtitles' lesson.id %}" hx-encoding="multipart/form-data" hx-target="#lesson-{{ lesson.id }}-form" data-upload-form>
  <div class="row g-2 align-items-end">
    <div class="col-sm-4 col-md-3">
      <label class="form-label small mb-1" for="{{ form.language.id_for_label }}">{{ form.language.label }}</label>
      {{ form.language }}
    </div>
    <div class="col-sm">
      <label class="form-label small mb-1" for="{{ form.file.id_for_label }}">{{ form.file.label }}</label>
      {{ form.file }}
    </div>
    <div class="col-12 col-md-auto d-flex gap-2">
      <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-cloud-arrow-up me-1" aria-hidden="true"></i>Kaydet</button>
      <button type="button" class="btn btn-outline-secondary btn-sm" data-form-close>Vazgeç</button>
    </div>
  </div>
  {% for field in form %}{% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}{% endfor %}
  <div class="form-text">Aynı dilde altyazı varsa yenisi yerine geçer. {% if not lesson.video_id %}Video Bunny'de hazır olunca gönderilir.{% endif %}</div>
</form>
