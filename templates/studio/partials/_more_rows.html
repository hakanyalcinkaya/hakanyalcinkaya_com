{# Kaydırmalı sayfalama: liste sonunda görünür olunca sonraki sayfanın satırlarıyla yer değiştirir. #}
{% load studio_tags %}
{% if page.has_next %}
<div class="{{ more_class|default:'list-group-item' }} text-center text-body-tertiary small py-3" hx-get="{% next_rows_url page %}" hx-trigger="revealed" hx-swap="outerHTML" hx-sync="this:drop">
  <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>Yükleniyor… <span class="text-body-tertiary">({{ page.end_index }} / {{ page.paginator.count }})</span>
</div>
{% endif %}
