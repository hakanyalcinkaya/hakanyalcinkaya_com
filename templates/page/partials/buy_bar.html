{% if not course.owned %}
{# Mobil: fiyat kartı ekrandan çıkınca altta sabit satın alma çubuğu (site.js data-buy-bar). #}
<div class="hy-buy-bar d-lg-none fixed-bottom border-top bg-body px-3 py-2" data-buy-bar hidden>
  <div class="d-flex align-items-center gap-3">
    <div class="min-w-0 flex-grow-1">
      <div class="small text-body-tertiary text-truncate">{{ course.short }}</div>
      <div class="fw-semibold lh-sm"><span class="visually-hidden">Fiyat: </span>{{ course.price }}{% include "components/list_price.html" %}</div>
    </div>
    <a href="{{ course.buy_url }}" class="btn btn-primary text-nowrap"><span class="d-none d-sm-inline">Kursu Hemen </span>Satın Al <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i></a>
  </div>
</div>
{% endif %}
