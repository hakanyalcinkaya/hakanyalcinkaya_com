{# Ödeme sayfasının içeriği: iyzico'dan dönüşten sonra onay beklenirken üç saniyede bir yenilenen durum. #}
<div id="odeme-durumu" class="text-center px-3 py-5" hx-get="{{ request.path }}?result=ok" hx-trigger="every 3s" hx-swap="outerHTML" role="status">
  <div class="spinner-border text-primary" aria-hidden="true"></div>
  <p class="fw-semibold mt-3 mb-1">Ödemen onaylanıyor…</p>
  <p class="small text-body-secondary mb-0">Birkaç saniye sürebilir; sayfayı kapatsan da onay gelince kursların açılır ve sipariş özeti <b class="text-body">{{ order.email }}</b> adresine gelir.</p>
</div>
