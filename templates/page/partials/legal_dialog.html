{# Yasal metin penceresi (ör. kayıt formundaki Kullanım Şartları bağlantısı): aynı adresin HTMX yanıtı; ✕, Kapat, Esc ya da dışarı tıklama kapatır. #}
<div class="d-flex align-items-start justify-content-between gap-3 border-bottom px-3 px-md-4 py-3">
  <div>
    <h2 id="site-dialog-title" class="h5 fw-semibold mb-1">{{ title }}</h2>
    <p class="small text-body-tertiary mb-0">Son güncelleme: {{ updated }}</p>
  </div>
  <button type="button" class="btn-close" data-dialog-close aria-label="Kapat"></button>
</div>
<div class="overflow-y-auto px-3 px-md-4 py-3 hy-site-dialog-scroll">
  <p class="text-body-secondary">{{ intro }}</p>
  {% include "page/partials/legal_sections.html" %}
</div>
<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 border-top px-3 px-md-4 py-3">
  <a href="{{ request.path }}" target="_blank" rel="noopener" class="small">Yeni sekmede aç <i class="bi bi-box-arrow-up-right ms-1" aria-hidden="true"></i></a>
  <button type="button" class="btn btn-primary" data-dialog-close>Kapat</button>
</div>
