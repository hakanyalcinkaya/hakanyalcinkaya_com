<section class="{{ section_class }}" aria-labelledby="yorum-baslik-{{ place }}">
  <h2 id="yorum-baslik-{{ place }}" class="h5 fw-semibold mb-3">Öğrenciler ne diyor?</h2>
  <div class="row g-3">
    {% for review in reviews %}
    <div class="col-md-4">
      <figure class="card h-100 mb-0">
        <div class="card-body p-4"><blockquote class="small mb-0 text-pre-line">{{ review.text }}</blockquote></div>
        <figcaption class="card-footer bg-transparent d-flex align-items-center gap-2 small fw-semibold px-4 py-3">
          <span class="d-inline-flex align-items-center justify-content-center rounded-1 bg-primary-subtle text-primary-emphasis hy-avatar" aria-hidden="true">{{ review.initial }}</span>{{ review.name }}
        </figcaption>
      </figure>
    </div>
    {% endfor %}
  </div>
</section>
