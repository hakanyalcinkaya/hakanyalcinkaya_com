{% load crispy_forms_tags %}
<div id="bulten" class="card mt-5">
  <div class="card-body p-4 p-lg-5">
    <div class="row g-4">
      <div class="col-lg-5">
        <h2 id="bulten-baslik" class="h3 fw-semibold">Henüz karar vermedin mi? Yeni kurslardan ilk sen haberdar ol.</h2>
        <p class="text-body-secondary mb-0">Yeni yazılım kursları, faydalı kaynaklar ve geliştirici içerikleri e-posta kutuna gelsin.</p>
      </div>
      <div class="col-lg-7">
        <form method="post" action="{% url 'page:index' %}#bulten" novalidate aria-describedby="bulten-not">
          {% csrf_token %}
          {% crispy form %}
          <p id="bulten-not" class="small text-body-tertiary mt-3 mb-0">İstediğin zaman abonelikten çıkabilirsin. <a href="{{ privacy_url }}">Gizlilik Politikası</a></p>
        </form>
      </div>
    </div>
  </div>
</div>
