{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Hakan Yalçınkaya — Yazılım ve Üretkenlik Odaklı Kurslar{% endblock %}</title>
<meta name="description" content="{% block description %}Gerçek projelerle Python, Django, React ve modern web teknolojilerini öğren. Hakan Yalçınkaya'nın yazılım ve üretkenlik odaklı kursları.{% endblock %}">
{% block head %}{% endblock %}
<link rel="stylesheet" href="{% static 'css/fonts.css' %}">
<link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}">
<link rel="stylesheet" href="{% static 'css/hy.css' %}">
<script src="{% static 'js/theme.js' %}"></script>
</head>
<body hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'>
<a href="#icerik" class="visually-hidden-focusable btn btn-primary position-absolute top-0 start-0 m-2" style="z-index:2000">İçeriğe geç</a>
{% include "_base/navbar.html" %}
<main id="icerik">
{% block content %}{% endblock %}
</main>
{% include "_base/footer.html" %}
<script src="{% static 'django_htmx/htmx.min.js' %}"></script>
<script src="{% static 'js/site.js' %}"></script>
</body>
</html>
