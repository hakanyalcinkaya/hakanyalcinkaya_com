{# Konuşmadaki mesaj; yönetici yanıtı vurgulu. Sitede ve stüdyoda ortak. #}
<li class="card{% if message.from_staff %} border-primary-subtle bg-primary-subtle bg-opacity-25{% endif %}">
  <div class="card-body p-3 p-sm-4">
    <div class="d-flex flex-wrap align-items-center gap-2 small mb-2">
      <span class="fw-semibold">{{ message.author_name }}</span>
      {% if message.from_staff %}<span class="badge rounded-1 border text-primary-emphasis fw-medium">Destek</span>{% endif %}
      <time class="text-body-tertiary ms-auto" datetime="{{ message.created_at|date:'c' }}">{{ message.created_at|date:"j F Y, H:i" }}</time>
    </div>
    <p class="mb-0 text-pre-line">{{ message.body }}</p>
  </div>
</li>
